services:
  mysql:
    image: mysql:8.0
    container_name: treasury-mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: treasury
      MYSQL_USER: treasury_user
      MYSQL_PASSWORD: treasury_pass
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: